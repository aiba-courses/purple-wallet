<div class="block__start">
  <div class="start__logo">
    <img priority ngSrc="/images/logo.svg" alt="logo" width="170" height="41" routerLink="private/dashboard">
  </div>

  <div class="start__menu">
    @for (item of navLinks; track item.id) {
      <app-nav-button
        [text]="item.text"
        [iconUrl]="item.iconUrl"
        [iconUrlActive]="item.iconUrlActive"
        [disabled]="item.disabled"
        [routerLink]="item.link"
        routerLinkActive="active"
      />
    }
  </div>

  <div class="start__exit-link">
    <app-nav-button
      text="Выход"
      iconUrl="/icons/logout.svg"
      (clicked)="onLogoutClick()"
    />
  </div>
</div>

<div class="block__end">
  <div class="end__nav">
    <app-header />
    <router-outlet></router-outlet>
  </div>
</div>
