<div class="login_container">
  <h1 class="login__heading">
    Вход
  </h1>

  <div class="login__form">
    <app-input
      class="login__form--control"
      iconUrl="icons/mail.svg"
      (controlValue)="onInputChange($event)"
    />

    <app-password-input
      class="login__form--control"
      iconUrl="icons/lock.svg"
      (controlValue)="onInputChange($event)"
    />

    <app-button
      title="Войти"
      routerLink="/private"
    >
      <span>Войти</span>
    </app-button>
  </div>
</div>
