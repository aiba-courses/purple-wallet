<div class="form__control">
  <input
    class="form__input"
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="disabled"
    (input)="handleInput($event)"
  />
  <div class="form__icon">
    @if (iconUrl()) {
      <img [src]="iconUrl()" width="30" height="30" [alt]="type()" />
    }
  </div>
</div>
